<script>
(function(){
const TABELA_PERFIL='profiles',COLUNA_ID='id',COLUNA_PAGO_ATE='pago_ate';
const HASH_KEY='rotaSyncHash',DAY_KEY='rotaDayInfo',DAY=864e5;
let uid=null,pushTimer=null,applying=false,busy=false;
function canon(v){if(Array.isArray(v))return'['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return s.length+':'+h}
function payload(){return{stops:JSON.parse(JSON.stringify(stops)),displayMode,lotKind,coordCorrections:window.coordCorrections||{}}}
function localHash(){return hash(canon(payload()))}
function storedHash(){try{return localStorage.getItem(HASH_KEY)}catch(e){return null}}
function setStored(h){try{if(h===null)localStorage.removeItem(HASH_KEY);else localStorage.setItem(HASH_KEY,h)}catch(e){}}
async function push(){
if(!uid||busy)return;
const p=payload(),h=hash(canon(p)),prev=storedHash();
if(h===prev)return;
busy=true;setStored(h);
try{
const r=await supabaseClient.from('user_routes').upsert({user_id:uid,route_data:p,updated_at:new Date().toISOString()});
if(r.error)throw r.error
}catch(e){setStored(prev)}
busy=false;
if(localHash()!==storedHash())schedule()
}
function schedule(){if(!uid)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}
function applyRemote(p){
const h=hash(canon(p));
if(h===localHash()){setStored(h);return}
if(localHash()!==storedHash()&&storedHash()!==null)return;
const oldIds=stops.map(s=>s.id).join('|'),newIds=(p.stops||[]).map(s=>s.id).join('|'),keep=selected&&selected.id;
applying=true;
try{
stops=p.stops||[];
if(p.displayMode==='O'||p.displayMode==='P')displayMode=p.displayMode;
if(['P','O','S','X'].includes(p.lotKind))lotKind=p.lotKind;
window.coordCorrections=p.coordCorrections||{};
if(oldIds!==newIds){
if(timer){clearInterval(timer);timer=null}
routeRequest++;
if(routeLayer){routeLayer.remove();routeLayer=null}
arrowMarkers.forEach(a=>a.remove());arrowMarkers=[];
startTime=0;timerElapsed=0;timerRunning=false;routeKm=0;manualTargetId=null;lotModeActive=false;lotModeLo=null;
selected=firstPending();
updateTimerUI()
}else selected=stops.find(s=>s.id===keep)||firstPending();
const mb=$('modeBtn');if(mb)mb.textContent=displayMode;
save();
updateUI();
if(map){renderMap();if(oldIds!==newIds&&stops.length)frameRoute()}
if(oldIds!==newIds&&stops.length)toast('Rota recebida da nuvem.',2500);
}finally{applying=false}
setStored(h)
}
async function pull(){
if(!uid)return;
try{
const r=await supabaseClient.from('user_routes').select('route_data').eq('user_id',uid).maybeSingle();
if(r.error)return;
if(r.data&&r.data.route_data)applyRemote(r.data.route_data);
if(stops.length||storedHash()!==null){if(localHash()!==storedHash())schedule()}
}catch(e){}
}
function listen(){
supabaseClient.channel('rota-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'user_routes',filter:'user_id=eq.'+uid},m=>{if(m.new&&m.new.route_data)applyRemote(m.new.route_data)}).subscribe()
}
const baseSave=save;
save=function(){const r=baseSave.apply(this,arguments);if(!applying)schedule();return r};
function pad(n){return String(n).padStart(2,'0')}
function day0(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function renderDays(info){
const el=document.getElementById('dayCount');
if(!el||!info||!info.c)return;
const now=new Date(),pago=info.p?new Date(info.p):null;
let n,max,msg;
if(pago&&pago.getTime()>now.getTime()){
max=30;n=Math.min(max,Math.max(1,Math.floor((day0(now)-day0(new Date(pago.getTime()-30*DAY)))/DAY)+1));msg='Assinatura: dia '+n+' de 30'
}else{
max=15;n=Math.min(max,Math.max(1,Math.floor((day0(now)-day0(new Date(info.c)))/DAY)+1));msg='Teste grátis: dia '+n+' de 15'
}
el.textContent='d '+pad(n);el.title=msg
}
async function lerPago(user){
const meta=Object.assign({},user.app_metadata,user.user_metadata);
let v=meta.pago_ate||localStorage.getItem('pago_ate')||localStorage.getItem('pagoAte');
if(v)return v;
try{
const r=await supabaseClient.from(TABELA_PERFIL).select(COLUNA_PAGO_ATE).eq(COLUNA_ID,user.id).maybeSingle();
if(!r.error&&r.data)return r.data[COLUNA_PAGO_ATE]
}catch(e){}
return null
}
function mountDays(){
const w=document.getElementById('timerWidget');
if(!w||document.getElementById('dayCount'))return;
const st=document.createElement('style');
st.textContent='#dayCount{margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,138,61,.45);color:#ffd2b0}';
document.head.appendChild(st);
const el=document.createElement('span');el.id='dayCount';w.appendChild(el)
}
async function startDays(user){
let info=null;
try{info=JSON.parse(localStorage.getItem(DAY_KEY)||'null')}catch(e){}
if(info)renderDays(info);
if(user){
const p=await lerPago(user);
info={c:user.created_at,p:p||null};
try{localStorage.setItem(DAY_KEY,JSON.stringify(info))}catch(e){}
renderDays(info)
}
setInterval(()=>renderDays(info),6e4)
}
async function init(){
mountDays();
let user=null;
try{const s=(await supabaseClient.auth.getSession()).data.session;user=s&&s.user}catch(e){}
startDays(user);
if(!user)return;
uid=user.id;
await pull();
listen();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('online',pull)
}
const lo=document.getElementById('logoutBtn');
if(lo)lo.addEventListener('click',()=>{setStored(null);try{localStorage.removeItem(DAY_KEY)}catch(e){}});
if(typeof supabaseClient!=='undefined'&&supabaseClient)init()
})();
</script>
