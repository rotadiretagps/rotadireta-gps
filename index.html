<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RotaDireta GPS - Login & Acesso</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
      --border: #333333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    
    .container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 28px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    .logo { font-size: 26px; font-weight: bold; color: var(--primary); margin-bottom: 6px; letter-spacing: 0.5px; }
    .slogan { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
    
    /* ABAS DE NAVEGAÇÃO (ENTRAR / CADASTRAR) */
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: #2a2a2a; color: var(--text); outline: none; font-size: 15px; }
    .input-group input:focus { border-color: var(--primary); }
    
    .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; background-color: var(--primary); color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; margin-top: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-pay { background-color: #3b82f6; color: white; text-decoration: none; display: block; text-align: center; margin-top: 15px; }
    .btn-pay:hover { background-color: #2563eb; }
    
    .hidden { display: none !important; }
    .status-box { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .status-expired { background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }
  </style>
</head>
<body>

  <div class="container" id="auth-card">
    <div class="logo">RotaDireta GPS</div>
    <div class="slogan">De um entregador para entregadores. Simples e fácil de usar.</div>

    <!-- NAVEGAÇÃO POR ABAS -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Cadastrar</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="login-form">
      <div class="input-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="input-group">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="Sua senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Entrar na Conta</button>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="signup-form" class="hidden">
      <div class="input-group">
        <label for="signup-email">E-mail</label>
        <input type="email" id="signup-email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="input-group">
        <label for="signup-password">Senha</label>
        <input type="password" id="signup-password" placeholder="Crie uma senha" required autocomplete="new-password">
      </div>
      <div class="input-group">
        <label for="signup-confirm-password">Confirmar Senha</label>
        <input type="password" id="signup-confirm-password" placeholder="Repita a senha" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn">Criar Conta (15 Dias Grátis)</button>
    </form>

    <!-- TELA DE BLOQUEIO DE PAGAMENTO (TRIAL / ASSINATURA EXPIRADA) -->
    <div id="payment-screen" class="hidden">
      <div class="status-box status-expired">
        Seu período de teste ou assinatura expirou!
      </div>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4;">
        Para continuar utilizando o RotaDireta GPS por mais 30 dias, realize a renovação de R$ 25,00.
      </p>
      <a href="https://invoice.infinitepay.io/alexandre-morche/ITaZ64Sot8" target="_blank" class="btn btn-pay">
        Pagar R$ 25,00 via InfinitePay
      </a>
    </div>
  </div>

  <script>
    // 1. CONFIGURAÇÕES DO SUPABASE
    const SUPABASE_URL = 'https://crrtjeanawlaodcexcad.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_IhRhHkEvnCuruc-mLU7fUQ_f7tnvQwJ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // E-MAILS DE ADMINISTRADOR (ACESSO ILIMITADO E VITALÍCIO)
    const ADMIN_EMAILS = [
      'rotadiretagps@gmail.com',
      'morchemarques@gmail.com'
    ];

    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const paymentScreen = document.getElementById('payment-screen');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');

    // Mudar de Aba
    function switchTab(mode) {
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
      } else {
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    // 2. VALIDAÇÃO DE ACESSO (ADMIN, TRIAL E MENSALIDADE)
    async function checkUserAccess(user) {
      // Se for administrador, libera o acesso imediatamente
      if (user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        window.location.href = 'roteirizador.html';
        return;
      }

      let { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('created_at, pago_ate')
        .eq('id', user.id)
        .single();

      if (error || !profile) {
        alert('Erro ao carregar dados do usuário.');
        return;
      }

      const now = new Date();
      const createdAt = new Date(profile.created_at);
      const trialEndDate = new Date(createdAt);
      trialEndDate.setDate(trialEndDate.getDate() + 15); // +15 Dias Grátis

      const paidUntil = profile.pago_ate ? new Date(profile.pago_ate) : null;

      const isTrialValid = now <= trialEndDate;
      const isSubscriptionValid = paidUntil && now <= paidUntil;

      if (isTrialValid || isSubscriptionValid) {
        window.location.href = 'roteirizador.html'; 
      } else {
        // Bloqueio por expiração
        loginForm.classList.add('hidden');
        signupForm.classList.add('hidden');
        document.querySelector('.tabs').classList.add('hidden');
        paymentScreen.classList.remove('hidden');
      }
    }

    // 3. AÇÃO DE LOGIN
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Erro ao entrar: ' + error.message);
        return;
      }

      if (data.user) {
        checkUserAccess(data.user);
      }
    });

    // 4. AÇÃO DE CADASTRO
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;

      if (password !== confirmPassword) {
        alert('As senhas não coincidem!');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        alert('Erro ao criar conta: ' + error.message);
        return;
      }

      if (data.user) {
        checkUserAccess(data.user);
      }
    });
  </script>
</body>
</html>
