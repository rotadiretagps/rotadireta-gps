<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>RotaDireta GPS</title>
    <style>
        :root { color-scheme: dark; --background: #111111; --card: #202020; --field: #292929; --green: #19b653; --muted: #a3a3ad; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 20px; display: grid; place-items: center; background: var(--background); color: #ffffff; font-family: Arial, Helvetica, sans-serif; }
        .card { width: min(100%, 650px); padding: clamp(22px, 5vw, 46px); border-radius: 26px; background: var(--card); box-shadow: 0 18px 50px #0005; }
        h1 { margin: 4px 0 14px; color: var(--green); text-align: center; font-size: clamp(30px, 6vw, 46px); }
        .subtitle { margin: 0 0 36px; color: var(--muted); text-align: center; font-size: 17px; line-height: 1.5; }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 28px; border-bottom: 3px solid #383838; }
        .tab { padding: 15px 8px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -3px; background: transparent; color: var(--muted); font-size: 18px; font-weight: bold; cursor: pointer; }
        .tab.active { color: var(--green); border-bottom-color: var(--green); }
        label { display: block; margin: 20px 0 9px; color: var(--muted); font-size: 16px; }
        input, select { width: 100%; min-height: 54px; padding: 15px; border: 1px solid #404040; border-radius: 12px; outline: none; background: var(--field); color: #ffffff; font-size: 17px; }
        input:focus, select:focus { border-color: var(--green); }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 58px; }
        .toggle-password { position: absolute; top: 50%; right: 8px; width: 42px; height: 42px; transform: translateY(-50%); display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #c7c7ce; cursor: pointer; }
        .toggle-password:hover { background: #383838; color: #ffffff; }
        .toggle-password svg { width: 22px; height: 22px; }
        .primary { width: 100%; min-height: 58px; margin-top: 26px; padding: 16px; border: 0; border-radius: 12px; background: var(--green); color: #07180c; font-size: 18px; font-weight: bold; cursor: pointer; }
        .primary:disabled { opacity: .6; cursor: wait; }
        .secondary { display: block; margin: 18px auto 0; padding: 5px; border: 0; background: transparent; color: #b7d8ff; font-size: 15px; text-decoration: underline; cursor: pointer; }
        .message { display: none; margin-top: 20px; padding: 15px; border-radius: 10px; overflow-wrap: anywhere; font-size: 15px; line-height: 1.5; }
        .message.success { display: block; background: #173b27; color: #a8f2c1; }
        .message.error { display: block; background: #472626; color: #ffb2b2; }
        .note { margin: 24px 0 0; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.5; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <h1>RotaDireta GPS</h1>
        <p class="subtitle">De um entregador para entregadores. Simples e fácil de usar.</p>
        <div class="tabs" role="tablist" aria-label="Acesso à conta">
            <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">Entrar</button>
            <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Cadastrar</button>
        </div>
        <form id="authForm">
            <div id="nameWrap" hidden>
                <label for="fullName">Nome</label>
                <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Seu nome completo">
            </div>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            
            <label for="password">Senha</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
                <button class="toggle-password" type="button" data-target="password" aria-label="Mostrar senha" title="Mostrar ou ocultar senha">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div id="confirmPasswordWrap" hidden>
                <label for="confirmPassword">Confirmar senha</label>
                <div class="password-wrap">
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6">
                    <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Mostrar senha" title="Mostrar ou ocultar senha">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="deviceRoleWrap">
                <label for="deviceRole">Função do Aparelho</label>
                <select id="deviceRole" name="deviceRole">
                    <option value="roteirizador">Aparelho 1: Carregar Lista e Roteirizar</option>
                    <option value="preparador">Aparelho 2: Preparar</option>
                </select>
            </div>

            <button class="primary" id="submitButton" type="submit">Entrar na Conta</button>
            <button class="secondary" id="forgotButton" type="button">Esqueci minha senha</button>
            <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>
        <p class="note" id="loginNote">Se você acabou de se cadastrar, confirme seu e-mail pelo link recebido e depois volte a esta página para entrar.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script>
        (() => {
            const LOGIN_URL = 'https://rotadiretagps.github.io/rotadireta-gps/';
            const ROUTER_URL = './roteirizador.html';
            const config = window.APP_CONFIG || {};
            const form = document.getElementById('authForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const fullNameInput = document.getElementById('fullName');
            const nameWrap = document.getElementById('nameWrap');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const confirmPasswordWrap = document.getElementById('confirmPasswordWrap');
            const deviceRoleWrap = document.getElementById('deviceRoleWrap');
            const deviceRoleSelect = document.getElementById('deviceRole');
            const submitButton = document.getElementById('submitButton');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const forgotButton = document.getElementById('forgotButton');
            const loginNote = document.getElementById('loginNote');
            const message = document.getElementById('message');
            let mode = 'login';
            let supabase = null;

            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'message ' + type;
            }

            function clearMessage() {
                message.textContent = '';
                message.className = 'message';
            }

            function setMode(nextMode, preserveMessage = false) {
                mode = nextMode;
                const isSignup = mode === 'signup';
                loginTab.classList.toggle('active', !isSignup);
                signupTab.classList.toggle('active', isSignup);
                loginTab.setAttribute('aria-selected', String(!isSignup));
                signupTab.setAttribute('aria-selected', String(isSignup));
                
                nameWrap.hidden = !isSignup;
                fullNameInput.required = isSignup;
                confirmPasswordWrap.hidden = !isSignup;
                confirmPasswordInput.required = isSignup;
                deviceRoleWrap.hidden = isSignup;
                forgotButton.hidden = isSignup;
                loginNote.hidden = isSignup;

                passwordInput.autocomplete = isSignup ? 'new-password' : 'current-password';
                submitButton.textContent = isSignup ? 'Criar Conta' : 'Entrar na Conta';
                if (!preserveMessage) clearMessage();
            }

            loginTab.addEventListener('click', () => setMode('login'));
            signupTab.addEventListener('click', () => setMode('signup'));

            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', () => {
                    const target = document.getElementById(button.dataset.target);
                    const showing = target.type === 'text';
                    target.type = showing ? 'password' : 'text';
                    button.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
                });
            });

            function handleAuthReturn() {
                const url = new URL(window.location.href);
                const hash = new URLSearchParams(url.hash.slice(1));
                const query = new URLSearchParams(url.search);
                const hasAuthReturn = hash.has('access_token') || hash.has('error') || query.has('code') || query.has('error');
                if (!hasAuthReturn) return;
                
                const errorText = hash.get('error_description') || query.get('error_description');
                history.replaceState({}, document.title, LOGIN_URL);
                setMode('login', true);
                if (errorText) {
                    showMessage('Não foi possível confirmar o e-mail. Solicite um novo link.', 'error');
                } else {
                    showMessage('E-mail confirmado com sucesso! Faça login na sua conta para continuar.', 'success');
                }
            }

            async function initialize() {
                if (!window.supabase || !config.SUPABASE_URL || !config.SUPABASE_PUBLISHABLE_KEY) {
                    submitButton.disabled = true;
                    showMessage('A conexão com o Supabase não está configurada.', 'error');
                    return;
                }
                supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_PUBLISHABLE_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
                });
                handleAuthReturn();
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                clearMessage();
                if (!supabase) return;

                const email = emailInput.value.trim();
                const password = passwordInput.value;
                submitButton.disabled = true;

                try {
                    if (mode === 'signup') {
                        if (password !== confirmPasswordInput.value) {
                            showMessage('As senhas não coincidem.', 'error');
                            submitButton.disabled = false;
                            return;
                        }
                        const fullName = fullNameInput.value.trim();
                        const { data, error } = await supabase.auth.signUp({
                            email,
                            password,
                            options: {
                                emailRedirectTo: LOGIN_URL,
                                data: { full_name: fullName }
                            }
                        });
                        if (error) throw error;
                        
                        setMode('login');
                        showMessage('Cadastro realizado! Abra o e-mail enviado pelo Supabase, clique em "Confirm email address" e depois volte a esta página para entrar.', 'success');
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) {
                            const errLower = error.message.toLowerCase();
                            if (errLower.includes('email not confirmed')) {
                                showMessage('Seu e-mail ainda não foi confirmado. Verifique sua caixa de entrada.', 'error');
                            } else if (errLower.includes('invalid login credentials')) {
                                showMessage('E-mail ou senha incorretos. Confirme se já ativou a conta pelo link do e-mail.', 'error');
                            } else {
                                showMessage(error.message, 'error');
                            }
                            submitButton.disabled = false;
                            return;
                        }
                        
                        if (data.user) {
                            const role = deviceRoleSelect.value;
                            localStorage.setItem('deviceRole', role);
                            localStorage.setItem('rotd_device_role', role);
                            localStorage.setItem('rotd_user_id', data.user.id);
                            window.location.replace(ROUTER_URL);
                        }
                    }
                } catch (error) {
                    showMessage(error.message || 'Erro ao processar a solicitação.', 'error');
                    submitButton.disabled = false;
                }
            });

            forgotButton.addEventListener('click', async () => {
                clearMessage();
                if (!supabase) return;
                const email = emailInput.value.trim();
                if (!email) {
                    showMessage('Insira o seu e-mail para recuperar a senha.', 'error');
                    return;
                }
                const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: LOGIN_URL });
                if (error) {
                    showMessage(error.message, 'error');
                } else {
                    showMessage('Instruções de recuperação enviadas para o seu e-mail.', 'success');
                }
            });

            initialize();
        })();
    </script>
</body>
</html>
